  if(a==="follow"){const m=fol.find(f=>f.follower_id===me.id&&f.following_id===id),k={follower_id:me.id,following_id:id};if(m)fol=fol.filter(f=>f!==m);else fol.push(k);FC[id]=Math.max(0,(FC[id]||0)+(m?-1:1));render();await(m?sb.from("follows").delete().match(k):sb.from("follows").insert(k));return}
  if(a==="edit")return edit(+id);
  if(a==="rep"){const p=posts.find(x=>x.id===id);if(!p||p.user_id===me.id)return;const m=rep.find(r=>r.user_id===me.id&&r.post_id===id),k={user_id:me.id,post_id:id};if(m)rep=rep.filter(r=>r!==m);else rep.push({...k,created_at:new Date().toISOString()});render();await(m?sb.from("reposts").delete().match(k):sb.from("reposts").insert(k));return}
  if(a==="logout"){await sb.auth.signOut();return}
  if(a==="user"){tab="me";viewU=id===me.id?null:id;render();return scrollTo(0,0)}
  if(a==="back"){viewU=null;return render()}
  if(a==="pedit"){const p=posts.find(x=>x.id===id);if(!p||p.user_id!==me.id)return;editP=id;editD=p.caption||"";return render()}
  if(a==="pcancel"){editP=null;return render()}
  if(a==="psave"){const p=posts.find(x=>x.id===id),v=$("#ec").value.trim();if(!p||p.user_id!==me.id)return;p.caption=v;editP=null;render();const {error}=await sb.from("posts").update({caption:v}).eq("id",id);if(error)alert("Не получилось сохранить: "+error.message);return}
  if(a==="notif"){
    if(notifOn()){sset("kr_notif","0");await pushOff();return render()}
    sset("kr_notif","1");
    if(typeof Notification!=="undefined"&&Notification.permission==="default"){try{await Notification.requestPermission()}catch(e){}}
    const r=await pushOn();render();if(r)alert(r);return}
  if(a==="flist"){const ids=id==="in"?fol.filter(f=>f.following_id===me.id).map(f=>f.follower_id):fol.filter(f=>f.follower_id===me.id).map(f=>f.following_id);showList(id==="in"?"Подписчики":"Подписки",ids);return}
  if(a==="chat"||a==="write"){tab="chat";chatU=id;viewU=null;chatD="";markRead(id);return scrollTo(0,document.body.scrollHeight)}
  if(a==="cback"){chatU=null;return render()}
  if(a==="msend"){const i=$("#mi"),tx=i.value.trim();if(!tx)return;i.value="";chatD="";const m={id:crypto.randomUUID(),sender_id:me.id,recipient_id:chatU,text:tx,created_at:new Date().toISOString(),read_at:null};msgs.push(m);render();scrollTo(0,document.body.scrollHeight);const {error}=await sb.from("messages").insert(m);if(error){msgs=msgs.filter(x=>x!==m);render();alert("Не отправилось: "+error.message)}return}
  if(a==="pick")return $("#file").click();
  if(a==="chg")return $("#avf").click();
  if(a==="rm"){pend.splice(+id,1);return render()}
  if(a==="like"){
    const m=likes.find(l=>l.post_id===id&&l.user_id===me.id),k={post_id:id,user_id:me.id};
    if(m)likes=likes.filter(l=>l!==m);else{pulse=id+"l";likes.push(k)}render();
    await(m?sb.from("likes").delete().match(k):sb.from("likes").insert(k));return;
  }
  if(a==="tg"){openC[id]=!openC[id];pulse=openC[id]?id+"c":null;render();const i=app.querySelector(`[data-c="${id}"]`);if(openC[id]&&i)i.focus({preventScroll:true});return}
  if(a==="send"){const i=app.querySelector(`[data-c="${id}"]`),tx=i.value.trim();if(!tx)return;i.value="";drafts[id]="";const r={id:crypto.randomUUID(),post_id:id,user_id:me.id,text:tx,created_at:new Date().toISOString()};coms.push(r);render();await sb.from("comments").insert(r);return}
  if(a==="del"){if(!confirm("Удалить пост?"))return;const p=posts.find(x=>x.id===id);posts=posts.filter(x=>x!==p);render();await sb.from("posts").delete().eq("id",id);const ps=(p.images||[]).map(u=>decodeURIComponent(u.split("/photos/")[1]));if(ps.length)sb.storage.from("photos").remove(ps);return}
  if(a==="savebio"){const b=$("#bio").value.trim();await sb.from("profiles").update({bio:b}).eq("id",me.id);P[me.id].bio=b;bioD=null;t.textContent="Сохранено ✓";return}
  if(a==="pub"){
    if(!pend.length)return alert("Сначала выбери фото");
    t.disabled=true;t.textContent="Публикуем…";
    const urls=[];for(const x of pend)urls.push(await up(x.b));
    const {error}=await sb.from("posts").insert({user_id:me.id,caption:$("#cap").value.trim(),images:urls});
    if(error)throw error;
    pend=[];capD="";if($("#cap"))$("#cap").value="";await load();tab="me";viewU=null;render();return;
  }
  }catch(x){alert("Не получилось: "+(x.message||x));render()}
});
app.addEventListener("change",async e=>{
  try{
  if(e.target.id==="file"){const fs=[...e.target.files].slice(0,10-pend.length);for(const f of fs){const b=await rs(f,1280);pend.push({b,u:URL.createObjectURL(b)})}e.target.value="";render()}
  if(e.target.id==="avf"){const f=e.target.files[0];if(f){const u=await up(await rs(f,640));await sb.from("profiles").update({ava:u}).eq("id",me.id);P[me.id].ava=u;render()}}
  }catch(x){alert("Не получилось: "+(x.message||x))}
});
app.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;render()}if(e.target.id==="bio")$("#bioc").textContent=e.target.value.length+"/300"});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="mi"){e.preventDefault();const b=app.querySelector('[data-a="msend"]');if(b)b.click()}});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;viewU=null;chatU=null;render();scrollTo(0,0)});

(async()=>{
  try{
    document.documentElement.style.setProperty("--hh",($("header").offsetHeight||58)+"px");
    document.addEventListener("visibilitychange",()=>{if(!document.hidden&&me&&tab==="chat"&&chatU)markRead(chatU)});
    const {data}=await sb.auth.getSession();me=data.session?data.session.user:null;
    if(me){await load();sub();refreshPush();go(location.hash)}else render();
  }catch(e){app.innerHTML='<div class="note">Не удаётся подключиться. Проверь интернет.</div>'}
  hide();
  sb.auth.onAuthStateChange((ev,s)=>{const u=s?s.user:null;if((u&&u.id)!==(me&&me.id)){me=u;if(me){tab="feed";load();sub();refreshPush()}else{msgs=[];chatU=null;sub();render()}}});
  setInterval(()=>{const ae=document.activeElement;if(me&&!document.hidden&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName)))load()},60000);
})();
</script>
</body>
</html>
